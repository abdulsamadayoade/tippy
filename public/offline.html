<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#064e5b" />
    <meta name="robots" content="noindex" />
    <title>You’re offline · Tippy</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
        color: #0b2239;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: #064e5b;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      h1 {
        margin: 32px 0 12px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -1px;
      }
      p {
        color: #5b7280;
        font-size: 15px;
        line-height: 1.6;
      }
      button {
        margin-top: 16px;
        min-height: 32px;
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        background: #064e5b;
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #b87529;
        outline-offset: 4px;
      }
      .hint {
        margin-top: 24px;
        font-size: 13px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #121212;
          color: #f2f3f5;
        }
        .brand {
          color: #fff;
        }
        p {
          color: #9aa0a8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" role="img" aria-label="Tippy">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true">
          <path
            d="M20 8C20 9.93293 18.433 11.5 16.5 11.5C14.567 11.5 13 9.93293 13 8C13 6.067 14.567 4.5 16.5 4.5C18.433 4.5 20 6.067 20 8Z"
            stroke-linecap="square" />
          <path
            d="M14.8311 4.92276C14.3768 3.51685 13.0571 2.5 11.5 2.5C9.567 2.5 8 4.067 8 6C8 7.93293 9.567 9.5 11.5 9.5C12.1043 9.5 12.6728 9.34684 13.1689 9.07723"
            stroke-linecap="round" />
          <path
            d="M4 13.5H6.39482C6.68897 13.5 6.97908 13.5663 7.24217 13.6936L9.28415 14.6816C9.54724 14.8089 9.83735 14.8751 10.1315 14.8751H11.1741C12.1825 14.8751 13 15.6662 13 16.642C13 16.6814 12.973 16.7161 12.9338 16.7269L10.3929 17.4295C9.93707 17.5555 9.449 17.5116 9.025 17.3064L6.84211 16.2503M13 16L17.5928 14.5889C18.407 14.3352 19.2871 14.636 19.7971 15.3423C20.1659 15.8529 20.0157 16.5842 19.4785 16.8942L11.9629 21.2305C11.4849 21.5063 10.9209 21.5736 10.3952 21.4176L4 19.5199"
            stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        <span aria-hidden="true">tippy</span>
      </div>
      <h1>Let’s reconnect.</h1>
      <p>
        You’re offline right now. Check your connection, then try again to get
        back to Tippy.
      </p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
